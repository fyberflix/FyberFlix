[project]
name = "fyberflix-risk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "zikriyon-prism>=0.1.0,<0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
