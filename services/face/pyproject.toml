[project]
name = "fyberflix-face"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",   # YuNet detector + SFace recognizer (Apache-2.0 / MIT models)
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "psycopg[binary,pool]>=3.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
