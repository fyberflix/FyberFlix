# Run published images instead of building. Same structure as the dev stack; pin by VERSION.
#   REGISTRY=docker.io/yourname VERSION=0.1.0 docker compose -f docker-compose.yml \
#     -f docker-compose.content.yml -f docker-compose.release.yml up -d
services:
  gateway:        { image: "${REGISTRY:?}/fyberflix-gateway:${VERSION:?}",        pull_policy: always }
  auth:           { image: "${REGISTRY}/fyberflix-auth:${VERSION}",               pull_policy: always }
  face:           { image: "${REGISTRY}/fyberflix-face:${VERSION}",               pull_policy: always }
  risk:           { image: "${REGISTRY}/fyberflix-risk:${VERSION}",               pull_policy: always }
  content:        { image: "${REGISTRY}/fyberflix-content-api:${VERSION}",        pull_policy: always }
  content-worker: { image: "${REGISTRY}/fyberflix-content-worker:${VERSION}",     pull_policy: always }
